# The themes built into the app: what users choose from in Settings > Appearance.
#
# Each theme has a unique name (1-32 letters, digits, spaces, dots, dashes or underscores; "Midnight"
# and "midnight" count as the same name), is either light or dark, and lists the colours it sets as
# "#RRGGBB" (in quotes). Only `primary` is required: every colour a theme leaves out is derived from
# its primary, so the smallest theme is a name, a brightness and one colour. The themes below list
# every colour, as a reference. The colours and what each is for are in api/theme-tokens.json.
#
# Text must stay readable on what it sits on: `make brand` refuses a theme whose text colour has
# less than 3:1 contrast with its background (WCAG asks 4.5:1 for ordinary text; the themes below
# have at least that). A server can offer more themes at runtime, from its Admin UI.
#
# `defaults` names the themes to use while the user follows the system's light or dark setting.
# Leave them empty to use the colours derived from `look.primary_color` in brand.yaml.
schema: 1

defaults:
  light: ""
  dark: ""

themes:
  - name: Paper
    brightness: light
    colors:
      # Main colour
      primary: "#2F5D8C"
      on_primary: "#FFFFFF"
      primary_container: "#DAE0E5"
      on_primary_container: "#1F1D1A"
      # Secondary colour
      secondary: "#5C6B73"
      on_secondary: "#FFFFFF"
      secondary_container: "#E2E3E0"
      on_secondary_container: "#1F1D1A"
      # Accent colour
      tertiary: "#8A5A00"
      on_tertiary: "#FFFFFF"
      tertiary_container: "#E5D9C1"
      on_tertiary_container: "#1F1D1A"
      # Errors and urgent messages
      error: "#B3261E"
      on_error: "#FFFFFF"
      error_container: "#F9DEDC"
      on_error_container: "#1F1D1A"
      # Backgrounds and surfaces
      background: "#F6F4EF"
      surface: "#FFFDF8"
      surface_container_lowest: "#FFFEFC"
      surface_container_low: "#F8F6F1"
      surface_container: "#F2F0EB"
      surface_container_high: "#EBE9E4"
      surface_container_highest: "#E4E2DD"
      # Text
      on_surface: "#1F1D1A"
      on_surface_variant: "#504E4B"
      # Borders
      border: "#84827E"
      border_subtle: "#D7D5D0"
      # Overlays and effects
      shadow: "#000000"
      scrim: "#000000"
      inverse_surface: "#1F1D1A"
      on_inverse_surface: "#FFFDF8"
      inverse_primary: "#97AEC6"
  - name: Sepia
    brightness: light
    colors:
      # Main colour
      primary: "#8B5A2B"
      on_primary: "#FFFFFF"
      primary_container: "#E6D7BF"
      on_primary_container: "#3B2F20"
      # Secondary colour
      secondary: "#6B5B45"
      on_secondary: "#FFFFFF"
      secondary_container: "#E0D7C4"
      on_secondary_container: "#3B2F20"
      # Accent colour
      tertiary: "#7A4E8C"
      on_tertiary: "#FFFFFF"
      tertiary_container: "#DECECE"
      on_tertiary_container: "#3B2F20"
      # Errors and urgent messages
      error: "#B3261E"
      on_error: "#FFFFFF"
      error_container: "#F9DEDC"
      on_error_container: "#3B2F20"
      # Backgrounds and surfaces
      background: "#F1E7D0"
      surface: "#FAF2E0"
      surface_container_lowest: "#FDF9F1"
      surface_container_low: "#F4ECDA"
      surface_container: "#EFE6D4"
      surface_container_high: "#E9E0CF"
      surface_container_highest: "#E3DBC9"
      # Text
      on_surface: "#3B2F20"
      on_surface_variant: "#655A4A"
      # Borders
      border: "#918776"
      border_subtle: "#D8CFBD"
      # Overlays and effects
      shadow: "#000000"
      scrim: "#000000"
      inverse_surface: "#3B2F20"
      on_inverse_surface: "#FAF2E0"

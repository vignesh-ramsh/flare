name: app
description: Push notification client for Android, iOS, Windows, macOS, Linux and the web. Name, colour and icon come from the brand folder.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.3
  tray_manager: ^0.8.0
  window_manager: ^0.5.2
  uuid: ^4.6.0
  dbus: ^0.8.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/logo.png
    - assets/brand/tray_linux.png
    - assets/brand/tray_macos_template.png
    - assets/brand/tray_windows.ico

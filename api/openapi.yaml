openapi: 3.1.0
info:
  title: Flare API
  version: "1"
  summary: Publish messages to topics over HTTP; subscribe from anywhere.
  description: |
    Flare is a publish/subscribe notification server. A publisher sends a message
    to a **topic**; everyone subscribed to that topic receives it.

    ```
    curl -d "Backup finished" -H "Title: Backups" https://flare.example.com/backups
    curl -s https://flare.example.com/backups/json
    ```

    ## Delivery

    A message is stored before the publisher gets its answer, and kept for the
    server's cache duration (`limits.cache_duration` in `/v1/config`). Messages
    carry an `id` that sorts by time. A subscriber that disconnects remembers the
    `id` of the last message it received and reconnects with `since=<id>`: it then
    gets everything it missed, and every message arrives once per connection, in
    order. A subscriber that can't keep up is disconnected and should do the same.

    ## Errors

    Every error response has the same JSON body: a `code` (the HTTP status
    followed by two digits), the `http` status and a human-readable `error`.

    ## Status

    Attachments, delayed delivery and action buttons are not supported yet; a
    request that uses them is refused with code 40003 instead of having them
    silently ignored.

    ## Push notifications

    An app that is not running can be woken by the push service of its platform.
    The app registers itself with `POST /v1/devices` (which push service reaches
    it, and the token or endpoint that service gave it), and gets an `id` and a
    `secret`. It then says which topics to be woken for with
    `PUT /v1/devices/{id}/subscriptions`, sending the secret in the `Device-Secret`
    header, and gets an opaque subscription `id` for each topic.

    A device acts with the access of whoever registered it, checked when it
    follows a topic and again before every notification, so withdrawing access
    stops its notifications. A device registered without logging in has only what an
    anonymous visitor has.

    A notification carries one JSON object. Either the message itself, in the shape
    of the `Message` schema plus `sub`, the subscription's ID; or, when the message
    is too large for the push service or the server is set to keep content out of
    push services, a poll request: `{"event":"poll_request","sub":"...","id":"..."}`
    with no topic and no content. The app then fetches the message with
    `GET /v1/messages/{id}` using its own credentials. It tells the topic by the
    subscription ID, which it keeps from the call that created it. Apps remove
    duplicates by message `id`.

    `/v1/config` lists which push services the server can use (`push`).

    ## Access

    What anyone may do on a topic is decided by access rules. A rule gives a user, or
    everyone, an access level (`read-write`, `read-only`, `write-only` or `deny-all`)
    on the topics a pattern matches, where `*` stands for any characters. Of the
    rules that match, the most specific decides: an exact name beats a pattern, a
    longer pattern beats a shorter one, and at equal specificity a user's own rule
    beats the one for everyone, a deny beats an allow, and otherwise rules add up.
    Where no rule matches, the server's default (`auth.default_access` in
    `/v1/config`) applies. Administrators may do everything.

    Requests without credentials are anonymous visitors. Credentials are an access
    token (`Authorization: Bearer flr_...`) or a user name and password (HTTP Basic).
    A request whose credentials are **wrong is refused**, never treated as anonymous.
    Tokens are the better choice: a password has to be checked on every request, and
    they can be revoked one at a time. Get one with `POST /v1/auth/login`.

    The answers when a request is refused: **401** if nobody is logged in and
    logging in could help, or if the credentials don't work (the response says how to
    authenticate); **403** if the logged-in user may not; **429** after too many
    failed logins from one address, with `Retry-After`.

    Open streams and WebSockets re-check access every 30 seconds, so revoking a
    token or withdrawing access ends a connection that is already open.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
# Credentials are optional: what a request may do depends on the access rules.
# Anonymous requests are allowed where the rules allow them.
security:
  - {}
  - bearerAuth: []
  - basicAuth: []
tags:
  - name: Account
    description: Log in, and manage your access tokens.
  - name: Publish
    description: Send a message to a topic.
  - name: Subscribe
    description: Receive messages, live or from the cache.
  - name: Push
    description: Register an app to be woken by push notifications, and fetch the message it was woken for.
  - name: Server
    description: Information about the server itself.
  - name: Themes
    description: The colour themes a server offers its apps.
  - name: Admin
    description: Managing the server. Needs a logged-in administrator.

paths:
  /:
    get:
      tags: [Server]
      summary: A hint for people who open the server in a browser
      operationId: index
      responses:
        "200":
          description: Plain text with example commands.
          content:
            text/plain: { schema: { type: string } }

  /healthz:
    get:
      tags: [Server]
      summary: The process is running
      operationId: healthz
      responses:
        "200":
          description: Always `ok`.
          content:
            text/plain: { schema: { type: string, examples: [ok] } }

  /readyz:
    get:
      tags: [Server]
      summary: The server can store messages
      description: Load balancers use this to decide whether to send traffic.
      operationId: readyz
      responses:
        "200":
          description: Ready.
          content:
            text/plain: { schema: { type: string, examples: [ok] } }
        "503":
          $ref: "#/components/responses/Error"

  /v1/config:
    get:
      tags: [Server]
      summary: What an app needs to know to show and use this server
      operationId: getServerConfig
      responses:
        "200":
          description: The server's name, look, limits and features.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerConfig" }

  /v1/messages:
    post:
      tags: [Publish]
      summary: Publish a message, with everything in a JSON body
      operationId: publishJSON
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "200":
          $ref: "#/components/responses/Published"
        default:
          $ref: "#/components/responses/Error"

  /v1/messages/{id}:
    get:
      tags: [Push]
      summary: Fetch one message
      description: |
        What an app does after a push notification told it that a message is waiting.
        Needs read access to the message's topic. A message that has expired is
        reported as not found.
      operationId: getMessage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        default:
          $ref: "#/components/responses/Error"

  /v1/themes:
    get:
      tags: [Themes]
      summary: The themes this server offers
      description: |
        Colour themes an admin added in the Admin UI. Apps show them next to the themes
        they were built with, under the server's name, and the user chooses.

        A theme is only colours, so, like `/v1/config`, this is public, even on a server
        that keeps its topics private. Servers that offer themes list the feature
        `themes` in `/v1/config`. The answer has an `ETag`, so an app that asks again on
        every connection is told when nothing changed (304).
      operationId: listThemes
      security:
        - {}
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: The themes, ordered by name.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [themes]
                properties:
                  themes:
                    type: array
                    items: { $ref: "#/components/schemas/Theme" }
        "304":
          description: Nothing has changed since the `ETag` the app sent.
        default:
          $ref: "#/components/responses/Error"

  /v1/themes/schema:
    get:
      tags: [Themes]
      summary: The colours a theme can set, and the rules themes follow
      description: |
        The same description as `api/theme-tokens.json` in the repository, which the app, the
        brand tool and the Admin UI share: each colour with its group, label and what it is
        for, the pairs of text and background that must stay readable, and the contrast and
        naming rules. An editor builds its form from it.
      operationId: getThemeSchema
      security:
        - {}
      responses:
        "200":
          description: The description.
          content:
            application/json:
              schema: { type: object }

  /v1/admin/themes:
    post:
      tags: [Admin, Themes]
      summary: Add a theme
      description: |
        Needs an administrator. The name must be new (names are compared without regard to
        case), and a server holds at most 50 themes. Colours the theme leaves out are derived
        by the app from its `primary`, so `primary` is the only colour required; the
        theme is refused if a text colour it sets has less than 3:1 contrast with the
        background it sets for it.
      operationId: createTheme
      security:
        - bearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Theme" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Theme" }
        default:
          $ref: "#/components/responses/Error"

  /v1/admin/themes/{name}:
    put:
      tags: [Admin, Themes]
      summary: Replace a theme
      description: |
        Needs an administrator. The body replaces the whole theme. The name in the body
        must be the one in the path, apart from capital letters: a theme cannot be renamed.
      operationId: replaceTheme
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/ThemeName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Theme" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Theme" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Admin, Themes]
      summary: Delete a theme
      description: |
        Needs an administrator. Apps that had chosen the theme fall back to following the
        system's light or dark the next time they ask the server for its themes.
      operationId: deleteTheme
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/ThemeName"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"

  /v1/devices:
    post:
      tags: [Push]
      summary: Register an app to receive push notifications
      description: |
        Says how this installation of an app can be woken. Which fields to give depends
        on the `provider`:

        | provider | give | what it is |
        |---|---|---|
        | `fcm` | `token` | the registration token Firebase gave the app (Android) |
        | `apns` | `token` | the device token Apple gave the app, in hexadecimal (iOS, macOS) |
        | `webpush` | `endpoint`, `keys` | a browser's push subscription, or a UnifiedPush distributor that gives keys; notifications are encrypted for it |
        | `unifiedpush` | `endpoint` | a UnifiedPush distributor's endpoint; the distributor sees the notification |
        | `relay` | `relay`, `handle` | the address of a push relay the server is set to use (see `push.relays` in `/v1/config`), and the handle that relay gave the app. The relay holds the app publisher's Firebase and Apple keys; it is told only the handle, the subscription and the message ID, and never the topic or the content |

        The server refuses a device it can't reach, such as an `fcm` device for an app
        it has no credentials for (see `push` in `/v1/config`), rather than accept it
        and never notify it. An `endpoint` must be an https URL at a public address.

        Registering a token that is already registered replaces the earlier
        registration, with its subscriptions, and returns a new secret.

        The device belongs to whoever is logged in. Without credentials it belongs to
        an anonymous visitor, which is only allowed on a server that lets anonymous
        visitors read.
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistration" }
      responses:
        "201":
          description: Registered. The secret is shown only now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCreated" }
        default:
          $ref: "#/components/responses/Error"

  /v1/devices/{id}/subscriptions:
    put:
      tags: [Push]
      summary: Say which topics the device is woken for
      description: |
        Replaces the whole list. Nothing changes unless the device's owner may read
        every topic listed. A topic the device already followed keeps its subscription
        ID.
      operationId: followTopics
      security:
        - deviceSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topics]
              additionalProperties: false
              properties:
                topics:
                  type: array
                  maxItems: 100
                  items: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
      responses:
        "200":
          description: The device's subscriptions, in the order given.
          content:
            application/json:
              schema:
                type: object
                required: [subscriptions]
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      required: [topic, id]
                      properties:
                        topic: { type: string }
                        id: { type: string, description: Opaque. Every notification for the topic carries it as `sub`. }
        default:
          $ref: "#/components/responses/Error"

  /v1/devices/{id}:
    delete:
      tags: [Push]
      summary: Forget a device
      description: Removes the device with its subscriptions and any notifications waiting for it.
      operationId: removeDevice
      security:
        - deviceSecret: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/login:
    post:
      tags: [Account]
      summary: Log in with a password and get an access token
      description: |
        Send the user name and password as HTTP Basic credentials. The answer holds a
        new access token, which is shown **only this once**. Keep it instead of the
        password. A token can't be used to log in: that would let whoever stole one
        make more, which would outlive its revocation.

        Failed attempts are counted per client address; after 10 in 10 minutes
        further attempts are refused with 429.
      operationId: login
      security:
        - basicAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        default:
          $ref: "#/components/responses/Error"

  /v1/account:
    get:
      tags: [Account]
      summary: Who you are and what you may do
      operationId: getAccount
      security:
        - bearerAuth: []
        - basicAuth: []
      responses:
        "200":
          description: The logged-in user, with the access rules that apply to them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default:
          $ref: "#/components/responses/Error"

  /v1/account/tokens:
    get:
      tags: [Account]
      summary: List your access tokens
      description: Without their secrets, which are not kept.
      operationId: listTokens
      security:
        - bearerAuth: []
        - basicAuth: []
      responses:
        "200":
          description: Your tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/TokenInfo" }
        default:
          $ref: "#/components/responses/Error"

  /v1/account/tokens/{id}:
    delete:
      tags: [Account]
      summary: Revoke one of your access tokens
      description: |
        Anything using the token is cut off, including connections that are already
        open (within 30 seconds). Revoking the token the request used logs that
        device out. A token that is not yours is reported as not found.
      operationId: deleteToken
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The token's `id`, as listed (not its secret).
          schema: { type: string }
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"

  /{topic}:
    parameters:
      - $ref: "#/components/parameters/Topic"
      - $ref: "#/components/parameters/TitleHeader"
      - $ref: "#/components/parameters/PriorityHeader"
      - $ref: "#/components/parameters/TagsHeader"
      - $ref: "#/components/parameters/ClickHeader"
    post:
      tags: [Publish]
      summary: Publish a message; the request body is the message
      description: |
        The body is the message text. Title, priority, tags and click URL are taken
        from headers, or from query parameters of the same name in lower case for
        tools that can't set headers. Header values may use RFC 2047 encoding
        (`=?UTF-8?B?...?=`) for non-ASCII text.

        A request with neither a title nor a body becomes the message `triggered`.
      operationId: publish
      requestBody:
        content:
          text/plain: { schema: { type: string } }
      responses:
        "200":
          $ref: "#/components/responses/Published"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Publish]
      summary: Publish a message (same as POST)
      operationId: publishPut
      requestBody:
        content:
          text/plain: { schema: { type: string } }
      responses:
        "200":
          $ref: "#/components/responses/Published"
        default:
          $ref: "#/components/responses/Error"

  /{topics}/json:
    get:
      tags: [Subscribe]
      summary: Stream messages as newline-delimited JSON
      description: |
        Keeps the connection open and writes one JSON object per line: an `open`
        event first (its `id` is a point to resume from if no message has arrived
        yet and `since` was not given), then `message` events as they arrive, and a
        `keepalive` event every 30 seconds while quiet. A client that sees nothing
        for much longer than that should reconnect.

        With `poll=1` it writes the cached messages and ends.
      operationId: streamJSON
      parameters:
        - $ref: "#/components/parameters/Topics"
        - $ref: "#/components/parameters/Since"
        - name: poll
          in: query
          description: "`1`, `true` or `yes` to return the cached messages and end, instead of streaming. Then `since` defaults to everything in the cache."
          schema: { type: string }
      responses:
        "200":
          description: A stream of events, one JSON object per line.
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/Message" }
        default:
          $ref: "#/components/responses/Error"

  /{topics}/sse:
    get:
      tags: [Subscribe]
      summary: Stream messages as Server-Sent Events
      description: |
        The same events as `/json`, in the Server-Sent Events format, for browsers'
        `EventSource`. Each `message` event has an `id:` line, so a browser that
        reconnects resumes from the last one by itself (`Last-Event-ID`).
      operationId: streamSSE
      parameters:
        - $ref: "#/components/parameters/Topics"
        - $ref: "#/components/parameters/Since"
        - name: Last-Event-ID
          in: header
          description: Sent by browsers when reconnecting. Used when `since` is not given.
          schema: { type: string }
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Error"

  /v1/ws:
    get:
      tags: [Subscribe]
      summary: One WebSocket for any number of topics, to subscribe and publish
      description: |
        Upgrades to a WebSocket. All frames are JSON text. Browsers may only
        connect from the server's own origin.

        Native clients log in with an `Authorization` header on the upgrade request.
        Browsers can't set one, so they send `{"op":"auth","token":"flr_..."}` as the
        first frame; the answer is `{"event":"authenticated","user":"..."}`. Logging in
        is only possible before subscribing to anything. Every subscribe and publish
        is checked against the access rules for whoever is logged in.

        **Client to server**

        | Frame | Meaning |
        |---|---|
        | `{"op":"subscribe","topic":"t","since":"..."}` | Follow a topic. `since` is optional, with the same values as the query parameter; without it only new messages arrive. |
        | `{"op":"unsubscribe","topic":"t"}` | Stop following a topic. |
        | `{"op":"publish","topic":"t","message":"...","title":"...","priority":4,"tags":["a"],"click":"https://..."}` | Publish a message. Only `topic` is required. |
        | `{"op":"auth","token":"flr_..."}` | Log in, before subscribing. |

        **Server to client**

        | Frame | Meaning |
        |---|---|
        | `{"event":"authenticated","user":"alice"}` | Answer to `auth`. |
        | `{"event":"subscribed","topic":"t"}` | The subscription is live; nothing published from now on is missed. |
        | `{"event":"unsubscribed","topic":"t"}` | Answer to `unsubscribe`. |
        | `{"event":"published","topic":"t","id":"..."}` | The message was stored. A connection that follows the topic it publishes to also receives the message itself, before or after this, and can tell it is its own by the `id`. |
        | `{"event":"message", ...}` | A message, in the shape of the `Message` schema. |
        | `{"event":"error","code":40301,"error":"...","topic":"t"}` | Something was refused. The connection stays open. Code 50002 means a subscription was dropped because the client fell behind: subscribe again with `since` set to the last message received. |

        On server shutdown the connection is closed with status 1001 (going away). If
        the user's credentials are revoked, it is closed with status 1008 (policy
        violation) after an error with code 40102.
      operationId: websocket
      responses:
        "101":
          description: Switching protocols.
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "flr_ followed by 43 characters"
      description: An access token, from `POST /v1/auth/login` or `flare token add`.
    basicAuth:
      type: http
      scheme: basic
      description: A user name and password. Checked on every request, which is slow by design; prefer a token.
    deviceSecret:
      type: apiKey
      in: header
      name: Device-Secret
      description: The secret returned when the device was registered. It is the device's own credential, separate from any user's token.

  parameters:
    ThemeName:
      name: name
      in: path
      required: true
      description: The theme's name (not case-sensitive), URL-encoded if it has spaces.
      schema: { type: string }
    DeviceId:
      name: id
      in: path
      required: true
      description: The device's `id`, from registering it.
      schema: { type: string }
    Topic:
      name: topic
      in: path
      required: true
      description: "1-64 letters, digits, `-` or `_`. `v1`, `healthz`, `readyz` and `metrics` are reserved. On a server that allows open access, the name is the only protection a topic has, so pick one that is hard to guess."
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
    Topics:
      name: topics
      in: path
      required: true
      description: One or more topic names, separated by commas.
      schema: { type: string, examples: ["alerts,backups"] }
    Since:
      name: since
      in: query
      description: |
        Where to start. One of: `all` (everything cached); a message ID (everything
        after that message, even if it has expired); a duration with a unit, such as
        `10m` or `2h`; or a unix timestamp in seconds. A bare small number is refused
        as ambiguous. Without it, a stream carries only new messages.
      schema: { type: string }
    TitleHeader:
      name: Title
      in: header
      description: A title, on one line, of up to 250 characters. Also accepted as the query parameter `title`.
      schema: { type: string }
    PriorityHeader:
      name: Priority
      in: header
      description: "1-5, or `min`, `low`, `default`, `high`, `max`/`urgent`. Default 3. Also accepted as the query parameter `priority`."
      schema: { type: string }
    TagsHeader:
      name: Tags
      in: header
      description: Up to 20 comma-separated tags. Also accepted as the query parameter `tags`.
      schema: { type: string }
    ClickHeader:
      name: Click
      in: header
      description: A URL to open when the notification is tapped. Not `javascript:`, `data:`, `file:`, `vbscript:` or `blob:`. Also accepted as the query parameter `click`.
      schema: { type: string }

  responses:
    Published:
      description: The message was stored and delivered to everyone subscribed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    Error:
      description: The request was refused or failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Message:
      type: object
      description: A message, or a stream event (`open`, `keepalive`) with only `event`, `time`, `topic` and, for `open`, `id`.
      required: [event, topic, time]
      properties:
        id:
          type: string
          description: A UUIDv7. IDs sort by creation time, as plain strings.
          examples: ["01933c3e-7a4f-7cc1-9b2e-5f1d6a8e4c21"]
        time: { type: integer, description: Unix time in seconds. }
        expires: { type: integer, description: Unix time in seconds after which the message is no longer cached. }
        event: { type: string, enum: [open, keepalive, message] }
        topic: { type: string, description: "The topic; for `open` and `keepalive`, the comma-separated topics of the stream." }
        title: { type: string }
        message: { type: string, description: The text. Omitted when empty. }
        priority: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string } }
        click: { type: string }

    PublishRequest:
      type: object
      required: [topic]
      additionalProperties: false
      properties:
        topic: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
        message: { type: string }
        title: { type: string }
        priority: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string }, maxItems: 20 }
        click: { type: string }

    Error:
      type: object
      required: [code, http, error]
      properties:
        code:
          type: integer
          description: |
            The HTTP status followed by two digits. 40001 invalid topic; 40002 invalid
            parameter; 40003 not supported (yet); 40004 unreadable body; 40101 log in
            first; 40102 invalid credentials; 40301 forbidden; 40401 not found; 40902
            token limit reached; 41301 message too large; 42902 too many failed
            logins; 42903 too many devices; 50001 internal error; 50301 not ready.
        http: { type: integer }
        error: { type: string }

    DeviceRegistration:
      type: object
      required: [app_id, platform, provider]
      additionalProperties: false
      properties:
        app_id:
          type: string
          maxLength: 128
          description: "The app's identifier: the Android application ID or the Apple bundle ID. A rebranded app has its own."
          examples: ["org.example.flare"]
        platform: { type: string, enum: [android, ios, macos, windows, linux, web] }
        provider: { type: string, enum: [fcm, apns, webpush, unifiedpush, relay] }
        token: { type: string, description: "For `fcm` and `apns`." }
        relay: { type: string, description: "For `relay`: the relay's address, which must be one the server is set to use.", examples: ["https://push.example.org"] }
        handle: { type: string, description: "For `relay`: the opaque handle the relay gave the app.", minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
        endpoint: { type: string, description: "For `webpush` and `unifiedpush`: an https URL at a public address." }
        keys:
          type: object
          description: "For `webpush`: from the browser's subscription (base64url)."
          required: [p256dh, auth]
          additionalProperties: false
          properties:
            p256dh: { type: string, description: "The browser's public key, an uncompressed P-256 point." }
            auth: { type: string, description: The 16-byte authentication secret. }
        app_version: { type: string, maxLength: 64 }

    DeviceCreated:
      type: object
      required: [id, secret]
      properties:
        id: { type: string }
        secret:
          type: string
          description: "`flrd_` and 43 characters. Send it in `Device-Secret` to manage the device. Only a hash is kept, so it can't be shown again."

    PushMessage:
      description: |
        What a push notification carries when it holds the message: the `Message`
        schema, with the ID of the subscription it is for.
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          required: [sub]
          properties:
            sub: { type: string, description: The subscription's ID. }

    PollRequest:
      type: object
      description: What a push notification carries when it only says that a message is waiting. Fetch it with `GET /v1/messages/{id}`.
      required: [event, sub, id]
      properties:
        event: { type: string, const: poll_request }
        sub: { type: string, description: The subscription's ID. }
        id: { type: string, description: The message's ID. }

    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 64
          description: A name for the token, such as the device it is for.
        expires_in:
          type: integer
          minimum: 0
          maximum: 315360000
          description: Seconds until the token expires. 0 or absent means never.

    TokenInfo:
      type: object
      required: [id, created]
      properties:
        id: { type: string, description: "Names the token for listing and revoking; it is not the secret." }
        label: { type: string }
        created: { type: integer, description: Unix time in seconds. }
        expires: { type: integer, description: "Unix time in seconds; absent if it never expires." }
        last_used: { type: integer, description: "Unix time in seconds, to within a minute; absent if never used." }

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenInfo"
        - type: object
          required: [token, user, role]
          properties:
            token: { type: string, description: "The secret. Shown only this once." }
            user: { type: string }
            role: { type: string, enum: [user, admin] }

    Account:
      type: object
      required: [user, role, default_access, access]
      properties:
        user: { type: string }
        role: { type: string, enum: [user, admin] }
        default_access:
          type: string
          enum: [read-write, read-only, write-only, deny-all]
          description: What applies where no rule does. Administrators may do everything regardless.
        access:
          type: array
          description: The rules that apply to this user, their own and those for everyone.
          items:
            type: object
            required: [pattern, access, scope]
            properties:
              pattern: { type: string, examples: ["alerts-*"] }
              access: { type: string, enum: [read-write, read-only, write-only, deny-all] }
              scope: { type: string, enum: [user, everyone] }

    Theme:
      type: object
      description: |
        A unique name, light or dark, and the colours the theme sets. The colours a theme
        can set, with what each is for, are listed by `GET /v1/themes/schema`. Colours left
        out are derived by the app from `primary`.
      required: [name, brightness, colors]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9 _.-]{0,31}$"
          description: Unique on the server, whatever the case.
          examples: [Midnight]
        brightness: { type: string, enum: [light, dark] }
        colors:
          type: object
          description: Colour name to `#RRGGBB`. `primary` is required.
          required: [primary]
          properties:
            primary: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", description: "The one colour every theme sets; the colours it leaves out are derived from it." }
          propertyNames: { pattern: "^[a-z]+(_[a-z]+)*$" }
          additionalProperties: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
          examples: [{ primary: "#8AB4F8", background: "#0B1220", surface: "#111A2B", on_surface: "#E6EDF7" }]
        created: { type: integer, readOnly: true, description: "When it was added, in Unix seconds." }
        updated: { type: integer, readOnly: true, description: "When it was last changed, in Unix seconds." }

    ServerConfig:
      type: object
      required: [api_version, name, primary_color, app_url_scheme, features, limits, auth]
      properties:
        api_version: { type: integer, examples: [1] }
        name: { type: string, description: What this server calls itself. }
        primary_color: { type: string, examples: ["#F97316"] }
        app_url_scheme: { type: string, description: The URL scheme of the app that opens this server's subscribe links. }
        base_url: { type: string, description: "The server's public address, if configured." }
        features:
          type: array
          items: { type: string }
          description: What this server can do. Check for a feature instead of comparing version numbers. `themes` means `GET /v1/themes` works.
          examples: [[publish, poll, sse, websocket, themes]]
        limits:
          type: object
          required: [message_size, cache_duration]
          properties:
            message_size: { type: integer, description: "The largest message, in bytes." }
            cache_duration: { type: integer, description: "How long messages are kept, in seconds." }
        auth:
          type: object
          required: [default_access]
          properties:
            default_access:
              type: string
              enum: [read-write, read-only, write-only, deny-all]
              description: What anyone may do on this server.
        push:
          type: object
          description: How this server can push to apps. Present when push notifications are on (the feature `push`).
          required: [providers]
          properties:
            providers:
              type: array
              items: { type: string, enum: [webpush, unifiedpush] }
              description: The services that work for every app.
            apps:
              type: object
              description: For `fcm` and `apns`, the app IDs the server holds credentials for.
              additionalProperties:
                type: array
                items: { type: string }
            relays:
              type: array
              items: { type: string }
              description: The relays the server wakes devices through.
            web_push_public_key:
              type: string
              description: The key a browser subscribes with (`applicationServerKey`), base64url.

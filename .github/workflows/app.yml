name: App

# Checks the Flutter app: formatting, analysis and tests, including tests of its connection
# code against the real Flare server (built here). Then builds the app for every platform
# with the official brand and checks that each build carries the brand's name and identifier.
# Run it by hand from the Actions tab (or the API) on any branch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "brand/**"
      - "server/**"
      - "api/**"
      - "Makefile"
      - ".github/workflows/app.yml"
      - ".github/actions/app-setup/**"
  pull_request:
    paths:
      - "app/**"
      - "brand/**"
      - "server/**"
      - "api/**"
      - "Makefile"
      - ".github/workflows/app.yml"
      - ".github/actions/app-setup/**"

permissions:
  contents: read

env:
  # Pinned: Dart's formatter output changes between releases.
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install what the tray plugin's native code needs to build
        # `flutter test` builds the plugins' native assets too, and the tray plugin's needs the
        # GTK, X11 and Xi development files.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build the server the connection tests run against
        run: make server
      - name: Generate the brand files, translations and database code
        run: make app-setup
      - name: Check formatting, analyze and test
        run: make app-check
        env:
          FLARE_SERVER_BIN: ${{ github.workspace }}/server/bin/flare

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux build tools
        # libsecret is what the app keeps sign-ins in; libx11 and libxi are for the tray plugin;
        # xvfb gives the integration tests a screen, and dbus and dunst a notification daemon.
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libx11-dev libxi-dev xvfb dbus dunst
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: ./.github/actions/app-setup
      - name: Build
        run: cd app && flutter build linux --release
      - name: Check that the program is named from the brand
        run: |
          binary=$(sed -n 's/^set(BRAND_BINARY_NAME "\(.*\)")/\1/p' app/linux/brand.cmake)
          test -x "app/build/linux/x64/release/bundle/$binary"
      - name: Run the app against the real server
        # The whole app on the real platform: first run, sign-in (this runner has no keyring, so
        # the app must fall back to keeping the sign-in in memory), subscribing, a live message.
        run: make app-integration
      - name: Run the app against a real notification daemon
        # A message becomes a notification dunst really shows; history, the open thread, minimum
        # priority and muted topics stay quiet.
        run: make app-notifications

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ./.github/actions/app-setup
      - name: Build
        run: cd app && flutter build apk --debug
      - name: Check that the app is named from the brand
        run: |
          id=$(sed -n 's/^applicationId=//p' app/android/brand.properties)
          name=$(sed -n 's/^appName=//p' app/android/brand.properties)
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$aapt2" dump badging app/build/app/outputs/flutter-apk/app-debug.apk)
          echo "$badging" | grep -E "^(package|application-label):"
          echo "$badging" | grep -q "^package: name='$id'"
          echo "$badging" | grep -q "^application-label:'$name'"
          # Subscribe links: the brand's scheme, registered for <scheme>://subscribe/...
          scheme=$(sed -n 's/^urlScheme=//p' app/android/brand.properties)
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml app/build/app/outputs/flutter-apk/app-debug.apk)
          echo "$manifest" | grep -E "android:scheme.*=\"$scheme\""
          echo "$manifest" | grep -E "android:host.*=\"subscribe\""

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ./.github/actions/app-setup
      - name: Build
        run: cd app && flutter build macos --debug
      - name: Check that the app is named from the brand
        run: |
          xcconfig=app/macos/Runner/Configs/Brand.xcconfig
          name=$(sed -n 's/^BRAND_APP_NAME = //p' "$xcconfig")
          id=$(sed -n 's/^BRAND_BUNDLE_ID = //p' "$xcconfig")
          bundle="app/build/macos/Build/Products/Debug/$name.app"
          test -d "$bundle"
          test "$(plutil -extract CFBundleIdentifier raw "$bundle/Contents/Info.plist")" = "$id"
          test "$(plutil -extract CFBundleName raw "$bundle/Contents/Info.plist")" = "$name"
          # The sandbox must allow outgoing connections, or the app cannot reach any server.
          codesign -d --entitlements - "$bundle" 2>&1 | grep -q "com.apple.security.network.client"

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ./.github/actions/app-setup
      - name: Build for the simulator
        run: cd app && flutter build ios --simulator --debug
      - name: Check that the app is named from the brand
        run: |
          xcconfig=app/ios/Flutter/Brand.xcconfig
          name=$(sed -n 's/^BRAND_APP_NAME = //p' "$xcconfig")
          id=$(sed -n 's/^BRAND_BUNDLE_ID = //p' "$xcconfig")
          plist=app/build/ios/iphonesimulator/Runner.app/Info.plist
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = "$id"
          test "$(plutil -extract CFBundleDisplayName raw "$plist")" = "$name"
          # Subscribe links: the brand's scheme is registered to the app.
          scheme=$(sed -n 's/^BRAND_URL_SCHEME = //p' "$xcconfig")
          test "$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$plist")" = "$scheme"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ./.github/actions/app-setup
      - name: Build
        run: cd app && flutter build windows --debug
      - name: Check that the program is named from the brand
        shell: pwsh
        run: |
          $brand = Get-Content app/windows/brand.cmake -Raw
          $bin = [regex]::Match($brand, 'BRAND_BINARY_NAME "(.*)"').Groups[1].Value
          $name = [regex]::Match($brand, 'BRAND_APP_NAME "(.*)"').Groups[1].Value
          $exe = "app/build/windows/x64/runner/Debug/$bin.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $info = (Get-Item $exe).VersionInfo
          Write-Host "ProductName=$($info.ProductName) InternalName=$($info.InternalName)"
          if ($info.ProductName -ne $name) { throw "ProductName is '$($info.ProductName)', expected '$name'" }
          if ($info.InternalName -ne $bin) { throw "InternalName is '$($info.InternalName)', expected '$bin'" }
